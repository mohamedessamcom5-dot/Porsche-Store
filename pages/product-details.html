<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - Porsche Store</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="../script.js" defer></script>
</head>

<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo-section">
                <img src="../images/logo.png" alt="Porsche Logo" class="header-logo" />
                <span class="brand-name">Porsche Store</span>
            </div>
            <nav class="main-nav">
                <a href="home.html">Home</a>
                <a href="products.html" class="active">Products</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="header-actions">
                <button class="theme-toggle" aria-label="Toggle theme">
                    <i class="fa-solid fa-sun"></i>
                </button>
                <a href="cart.html" class="cart-link">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart (<span id="cart-count">0</span>)</span>
                </a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="product-details-section">
            <div class="detail-breadcrumb">
                <a href="products.html"><i class="fa-solid fa-arrow-left"></i> Back to Products</a>
            </div>
            <div id="product-details" class="product-detail-card"></div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="home.html">Home</a>
                <a href="products.html">Products</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="footer-bottom">
                <p class="footer-credit">Designed by Mohamed Essam</p>
                <p>© 2025 Porsche Store. All Rights Reserved.</p>
            </div>
        </div>
    </footer>
</body>

</html>
